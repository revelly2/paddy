services:
  - type: web
    name: paddy-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://paddy-orpin.vercel.app"
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: "rice-images"
